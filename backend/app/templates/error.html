{% extends "base.html" %}
{% block title %}{{ status_code }} · {{ app_name }}{% endblock %}

{% block content %}
<section class="error-page">
  <p class="error-code">{{ status_code }}</p>
  <h1>{{ detail }}</h1>
  <p class="muted">可以返回首页，或者检查地址后重试。</p>
  <a class="button" href="/">回到首页</a>
</section>
{% endblock %}
