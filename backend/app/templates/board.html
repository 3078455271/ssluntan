{% extends "base.html" %}
{% block title %}{{ board.name }} · {{ app_name }}{% endblock %}

{% block content %}
<section class="page-heading">
  <div>
    <p class="eyebrow">版块</p>
    <h1>{{ board.name }}</h1>
    <p class="muted">{{ board.description or "暂无简介" }}</p>
  </div>
  <a class="button" href="/topics/new?board_id={{ board.id }}">在本版发帖</a>
</section>

<section class="section">
  <div class="section-heading">
    <h2>主题</h2>
    <span>{{ total }} 个主题</span>
  </div>
  {% include "_topic_list.html" %}
  {% include "_pagination.html" %}
</section>
{% endblock %}
